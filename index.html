<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Upstyle Destock — Catalogue</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--ink:#111;--muted:#777;--line:#e5e5e2}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.top-contact{background:#111;color:#fff;padding:9px 12px;text-align:center;font-size:13px;line-height:1.35}
.top-contact a{color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,243,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1200px;margin:auto;padding:13px 12px 10px}
.brand-row{display:flex;align-items:end;justify-content:space-between;gap:12px}
.brand{font-size:22px;font-weight:900;letter-spacing:.08em}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.count{font-size:12px;color:var(--muted);white-space:nowrap}
.search-wrap{margin-top:10px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:15px;outline:none}
.categories,.filters{display:flex;gap:7px;overflow-x:auto;padding-top:9px;scrollbar-width:none}.categories::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.cat-btn,.filters select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}.cat-btn.active{background:#111;color:#fff;border-color:#111}
main{max-width:1200px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pic{aspect-ratio:3/4;background:#fff;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;font-weight:800;padding:14px;background:#f0f0ed}
.status{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 7px;font-size:10px;font-weight:800}
.brand-badge{position:absolute;right:8px;top:8px;background:rgba(17,17,17,.88);color:#fff;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:800}
.info{padding:9px}.product-name{font-size:14px;font-weight:800;line-height:1.2}.meta{font-size:11px;color:var(--muted);margin-top:4px}
.prices{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:7px}.retail{font-size:11px;color:#999;text-decoration:line-through}.sale{font-size:18px;font-weight:900}.discount{font-size:10px;background:#111;color:#fff;border-radius:999px;padding:3px 6px}.zoom-hint{font-size:10px;color:#999;margin-top:6px}.empty{grid-column:1/-1;text-align:center;color:#777;padding:55px 20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:15px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.viewer{position:fixed;inset:0;background:#050505;z-index:99;display:none;overflow:hidden;touch-action:none}.viewer.open{display:block}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform}
.viewer-top{position:absolute;left:0;right:0;top:0;z-index:4;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 22px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent)}
.viewer-top button,.nav{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px}.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4}.prev{left:10px}.next{right:10px}
.viewer-bottom{position:absolute;left:0;right:0;bottom:0;color:#fff;text-align:center;padding:24px 14px calc(env(safe-area-inset-bottom) + 15px);background:linear-gradient(to top,rgba(0,0,0,.65),transparent);font-size:13px}
</style>
</head>
<body>
<div class="top-contact">Pour passer une commande, me contacter sur <a href="mailto:stephane@upstyle-destock.fr">stephane@upstyle-destock.fr</a></div>
<header><div class="header-inner">
<div class="brand-row"><div><div class="brand">UPSTYLE DESTOCK</div><div class="subtitle">Catalogue multimarques</div></div><div class="count" id="count">0 produit</div></div>
<div class="search-wrap"><input id="search" class="search" type="search" placeholder="Rechercher une marque, un produit, une taille…" oninput="applyFilters()"></div>
<div class="categories" id="categories"></div>
<div class="filters"><select id="brandFilter" onchange="applyFilters()"><option value="">Toutes marques</option></select><select id="sizeFilter" onchange="applyFilters()"><option value="">Toutes tailles</option></select><select id="statusFilter" onchange="applyFilters()"><option value="">Tous statuts</option><option value="Disponible">Disponible</option><option value="Réservé">Réservé</option><option value="Vendu">Vendu</option></select></div>
</div></header>
<main><div id="grid" class="grid"><div class="empty">Chargement du catalogue…</div></div></main>
<div id="viewer" class="viewer"><div class="stage" id="stage"><img id="vimg" alt=""></div><div class="viewer-top"><span id="vtitle"></span><button id="close">×</button></div><button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button><div class="viewer-bottom" id="vcounter"></div></div>
<script>
let products=[],visible=[],selectedCategory='Tous',current=null,pi=0;
const grid=document.getElementById('grid'),categoriesEl=document.getElementById('categories'),brandFilter=document.getElementById('brandFilter'),sizeFilter=document.getElementById('sizeFilter'),statusFilter=document.getElementById('statusFilter'),searchInput=document.getElementById('search');
function parseCSV(text){const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');const headers=lines.shift().split(';').map(x=>x.trim());return lines.map(line=>{const values=line.split(';');const o={};headers.forEach((h,i)=>o[h]=(values[i]??'').trim());return o})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function euro(v){const n=Number(String(v).replace(',','.'));return n?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n):''}
async function load(){try{const r=await fetch('produits.csv?ts='+Date.now());if(!r.ok)throw new Error();const rows=parseCSV(await r.text());products=rows.filter(r=>r.Nom).map(r=>({name:r.Nom,brand:r.Marque||'',category:r.Categorie||'Autres',size:r.Taille||'—',retail:Number((r['Prix retail']||'0').replace(',','.')),sale:Number((r['Prix vente']||'0').replace(',','.')),status:r.Statut||'Disponible',photos:[r.Photo1,r.Photo2,r.Photo3,r.Photo4,r.Photo5].filter(Boolean).map(x=>'photos/'+x)}));buildFilters();applyFilters()}catch(e){grid.innerHTML='<div class="empty"><b>Impossible de charger le catalogue.</b><br><br>Vérifie produits.csv et le dossier photos.</div>'}}
function unique(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'fr',{numeric:true}))}
function buildFilters(){const cats=['Tous',...unique(products.map(p=>p.category))];categoriesEl.innerHTML=cats.map(c=>`<button class="cat-btn ${c==='Tous'?'active':''}" onclick="setCategory('${String(c).replace(/'/g,"\\'")}',this)">${c}</button>`).join('');brandFilter.innerHTML='<option value="">Toutes marques</option>'+unique(products.map(p=>p.brand)).map(x=>`<option>${x}</option>`).join('');sizeFilter.innerHTML='<option value="">Toutes tailles</option>'+unique(products.map(p=>p.size)).map(x=>`<option>${x}</option>`).join('')}
function setCategory(c,b){selectedCategory=c;document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');applyFilters()}
function applyFilters(){const q=norm(searchInput.value);visible=products.filter(p=>{const hay=norm([p.name,p.brand,p.category,p.size,p.status].join(' '));return(selectedCategory==='Tous'||p.category===selectedCategory)&&(!brandFilter.value||p.brand===brandFilter.value)&&(!sizeFilter.value||p.size===sizeFilter.value)&&(!statusFilter.value||p.status===statusFilter.value)&&(!q||hay.includes(q))});render()}
function render(){document.getElementById('count').textContent=visible.length+' produit'+(visible.length>1?'s':'');if(!visible.length){grid.innerHTML='<div class="empty">Aucun produit ne correspond aux filtres.</div>';return}grid.innerHTML=visible.map((p,i)=>{const pct=p.retail&&p.sale?Math.round((1-p.sale/p.retail)*100):0;return `<article class="card"><div class="pic" onclick="${p.photos.length?`openViewer(${i})`:''}">${p.photos.length?`<img src="${p.photos[0]}" alt="${p.name}">`:`<div class="placeholder">PHOTO<br>À AJOUTER</div>`}<span class="status">${p.status}</span>${p.brand?`<span class="brand-badge">${p.brand}</span>`:''}</div><div class="info"><div class="product-name">${p.name}</div><div class="meta">${p.category} · Taille ${p.size}</div><div class="prices">${p.retail?`<span class="retail">${euro(p.retail)}</span>`:''}${p.sale?`<span class="sale">${euro(p.sale)}</span>`:''}${pct>0?`<span class="discount">-${pct}%</span>`:''}</div>${p.photos.length?'<div class="zoom-hint">Touchez la photo pour agrandir</div>':''}</div></article>`}).join('')}
const viewer=document.getElementById('viewer'),vimg=document.getElementById('vimg');let scale=1,tx=0,ty=0,pointers=new Map(),startDist=0,startScale=1,startX=0;
function openViewer(i){current=visible[i];pi=0;viewer.classList.add('open');document.body.style.overflow='hidden';show()}
function show(){reset();vimg.src=current.photos[pi];document.getElementById('vtitle').textContent=(current.brand?current.brand+' — ':'')+current.name;document.getElementById('vcounter').textContent=`${pi+1} / ${current.photos.length} · pincez pour zoomer · glissez pour changer`}
function reset(){scale=1;tx=0;ty=0;apply()}function apply(){vimg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function nxt(){pi=(pi+1)%current.photos.length;show()}function prv(){pi=(pi-1+current.photos.length)%current.photos.length;show()}
document.getElementById('close').onclick=()=>{viewer.classList.remove('open');document.body.style.overflow=''};document.getElementById('next').onclick=nxt;document.getElementById('prev').onclick=prv;vimg.ondblclick=()=>{scale=scale===1?2.5:1;tx=ty=0;apply()};
const stage=document.getElementById('stage');stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)startX=e.clientX;if(pointers.size===2){const a=[...pointers.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale}});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.min(5,Math.max(1,startScale*d/startDist));apply()}else if(pointers.size===1&&scale>1){tx+=e.clientX-old.x;ty+=e.clientY-old.y;apply()}});stage.addEventListener('pointerup',e=>{const end=e.clientX;pointers.delete(e.pointerId);if(scale===1&&Math.abs(end-startX)>55){end<startX?nxt():prv()}});stage.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));load();
</script>
</body></html>
