<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produit | Upstyle Destock</title>
<style>
:root{--yellow:#ffd400;--black:#111;--muted:#707070;--bg:#f4f4f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#111}
header{background:#111;color:#fff;padding:15px 18px;position:sticky;top:0;z-index:10}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:950;font-size:24px;text-decoration:none;color:#fff}.brand span{color:var(--yellow)}
.back{background:var(--yellow);color:#111;text-decoration:none;font-weight:900;padding:10px 14px;border-radius:10px;font-size:13px}
main{max-width:1100px;margin:28px auto;padding:0 16px}.status{padding:30px;text-align:center;color:#666}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 35px #00000010;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
.gallery{padding:20px;background:#fafafa}.hero-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:16px}
.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:3px}.thumbs img{width:74px;height:74px;object-fit:contain;background:#fff;border:2px solid transparent;border-radius:10px;cursor:pointer}.thumbs img.active{border-color:#111}
.info{padding:30px}.brandline{text-transform:uppercase;letter-spacing:.8px;font-size:12px;font-weight:900;color:#777}
h1{font-size:30px;line-height:1.15;margin:8px 0 12px}.meta{font-size:13px;color:#777;margin-bottom:18px}
.desc{white-space:pre-wrap;line-height:1.65;color:#444;font-size:15px}.pricebox{display:flex;align-items:center;gap:10px;margin:24px 0 18px;flex-wrap:wrap}
.sale{font-size:32px;font-weight:950}.retail{text-decoration:line-through;color:#888}.discount{background:var(--yellow);font-weight:950;border-radius:999px;padding:6px 9px;font-size:12px}
.stock{font-size:13px;font-weight:800;margin-bottom:18px}.stock.ok{color:#18703a}.stock.no{color:#a11}.actions{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;text-decoration:none;font-size:14px}
.primary{background:#111;color:#fff}.secondary{background:#ffd400;color:#111}.note{font-size:12px;color:#777;margin-top:14px}
.quick-actions{display:flex;gap:8px;margin:0 0 14px}.quick-icon{width:42px;height:42px;border:0;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer;box-shadow:0 3px 12px #0002}.quick-fav{background:#fff;color:#111}.quick-fav.active{background:#111;color:#ffd400}.quick-cart{background:#ffd400;color:#111}.quick-question{background:#f2f2f2;color:#111}.quick-whatsapp{background:#25D366;color:#fff}
.question-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px}.question-modal.open{display:flex}.question-box{width:min(560px,100%);background:#fff;border-radius:18px;padding:20px}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.question-head h3{margin:0}.question-close{width:38px;height:38px;border:0;border-radius:50%;font-size:22px}.question-product{margin:14px 0 12px;padding:10px 12px;background:#f7f7f5;border-radius:10px;font-weight:850;font-size:13px}.question-form{display:grid;gap:10px}.question-form label{font-size:12px;font-weight:850}.question-form input,.question-form textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit}.question-form textarea{min-height:130px;resize:vertical}.question-form button{background:#111;color:#fff}
@media(max-width:760px){.card{grid-template-columns:1fr}.info{padding:22px}h1{font-size:25px}.hero-img{aspect-ratio:4/3}}
</style>
</head>
<body>
<header><div class="header-inner"><a class="brand" href="/">UPSTYLE<span>-DESTOCK</span></a><a class="back" href="/">Voir le catalogue</a></div></header>
<main><div id="app" class="status">Chargement du produit…</div></main>
<div class="question-modal" id="productQuestionModal" aria-hidden="true">
  <div class="question-box">
    <div class="question-head"><h3>Poser une question</h3><button type="button" class="question-close" onclick="closeProductQuestion()">×</button></div>
    <div class="question-product" id="questionProductLabel"></div>
    <form class="question-form" onsubmit="sendProductQuestion(event)">
      <label>Votre nom<input id="questionName" type="text" autocomplete="name" required></label>
      <label>Votre email<input id="questionEmail" type="email" autocomplete="email" required></label>
      <label>Votre question<textarea id="questionText" required placeholder="Votre question sur ce produit…"></textarea></label>
      <input id="questionWebsite" type="text" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" aria-hidden="true">
      <button id="questionSubmitBtn" type="submit">✉ Envoyer la question</button>
      <div id="questionStatus" style="font-size:12px;color:#777">La question sera envoyée directement à Upstyle.</div>
    </form>
  </div>
</div>
<script>
const WORKER_URL='https://soft-tree-927f.stephane-0f5.workers.dev';
const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
function discount(p){const retail=Number(p.prixRetail||0),sale=Number(p.prixVente||0);return retail>sale&&retail>0?Math.round((1-sale/retail)*100):0}
function setMainPhoto(src,index){const img=document.getElementById('mainPhoto');if(img)img.src=src;document.querySelectorAll('.thumbs img').forEach((x,i)=>x.classList.toggle('active',i===index))}
function addToCart(p){const key='upstyle_cart_v2';let cart=[];try{cart=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(cart))cart=[];if(!cart.some(x=>x.id===p.id)){cart.push({id:p.id,nom:p.nom,marque:p.marque,taille:p.taille,prixVente:p.prixVente});localStorage.setItem(key,JSON.stringify(cart))}window.location.href='/'}
function loadFavs(){try{const v=JSON.parse(localStorage.getItem('upstyle_favorites_v1')||'[]');return Array.isArray(v)?v.map(String):[]}catch{return []}}
function isFav(id){return loadFavs().includes(String(id))}
function toggleFav(p){
  let favs=loadFavs(),id=String(p.id);
  favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
  localStorage.setItem('upstyle_favorites_v1',JSON.stringify(favs));
  const b=document.getElementById('favBtn');
  if(b){const active=favs.includes(id);b.classList.toggle('active',active);b.textContent=active?'♥':'♡';}
}
let currentProduct=null;
function shareProductWhatsApp(){
  if(!currentProduct)return;

  const productName=(currentProduct.marque?currentProduct.marque+' — ':'')+(currentProduct.nom||'Produit');
  const message='Ça pourrait t’intéresser 👀\n\n'+productName+'\n'+location.href;

  window.open(
    'https://wa.me/?text='+encodeURIComponent(message),
    '_blank',
    'noopener'
  );
}

function openProductQuestion(){
  if(!currentProduct)return;
  document.getElementById('questionProductLabel').textContent=(currentProduct.marque?currentProduct.marque+' — ':'')+(currentProduct.nom||'Produit');
  document.getElementById('questionText').value='';
  const m=document.getElementById('productQuestionModal');
  m.classList.add('open');
  m.setAttribute('aria-hidden','false');
}
function closeProductQuestion(){
  const m=document.getElementById('productQuestionModal');
  if(!m)return;
  m.classList.remove('open');
  m.setAttribute('aria-hidden','true');
}
async function sendProductQuestion(e){
  e.preventDefault();
  if(!currentProduct)return;

  const name=document.getElementById('questionName').value.trim();
  const email=document.getElementById('questionEmail').value.trim();
  const question=document.getElementById('questionText').value.trim();
  const website=document.getElementById('questionWebsite')?.value.trim()||'';
  const btn=document.getElementById('questionSubmitBtn');
  const status=document.getElementById('questionStatus');

  if(!name||!email||!question)return;

  try{
    if(btn){btn.disabled=true;btn.textContent='Envoi…';}
    if(status){status.textContent='Envoi de votre question…';status.style.color='#666';}

    const r=await fetch(WORKER_URL+'/product-question',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        productId:String(currentProduct.id||''),
        name,
        email,
        question,
        website
      })
    });

    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||('Erreur HTTP '+r.status));

    if(status){status.textContent=data.message||'Votre question a bien été envoyée.';status.style.color='#18703a';}
    document.getElementById('questionText').value='';
    setTimeout(closeProductQuestion,1400);
  }catch(err){
    if(status){status.textContent='Erreur : '+String(err.message||err);status.style.color='#a11';}
  }finally{
    if(btn){btn.disabled=false;btn.textContent='✉ Envoyer la question';}
  }
}
async function loadProduct(){
  const id=new URLSearchParams(location.search).get('id')||'',app=document.getElementById('app');
  if(!id){app.textContent='Produit non spécifié.';return}
  try{
    const r=await fetch(`${WORKER_URL}/catalog/product/${encodeURIComponent(id)}?ts=${Date.now()}`,{cache:'no-store'});
    const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||`HTTP ${r.status}`);
    document.title=`${p.marque?p.marque+' - ':''}${p.nom||'Produit'} | Upstyle Destock`;
    const photos=Array.isArray(p.photos)?p.photos.filter(Boolean):[],main=photos[0]||'',pc=discount(p);
    const available=String(p.statut||'').toLowerCase()==='disponible'&&Number(p.stock||0)>0;
    app.className='';app.innerHTML=`
      <section class="card">
        <div class="gallery">
          ${main?`<img id="mainPhoto" class="hero-img" src="${esc(main)}" alt="${esc(p.nom||'Produit')}">`:'<div class="hero-img" style="display:grid;place-items:center;color:#888">PHOTO</div>'}
          <div class="thumbs">${photos.map((x,i)=>`<img class="${i===0?'active':''}" src="${esc(x)}" alt="">`).join('')}</div>
        </div>
        <div class="info">
          <div class="brandline">${esc(p.marque||'UPSTYLE')}</div>
          <h1>${esc(p.nom||'Produit')}</h1>
          <div class="quick-actions">
            <button type="button" id="favBtn" class="quick-icon quick-fav ${isFav(p.id)?'active':''}" title="${isFav(p.id)?'Retirer des favoris':'Ajouter aux favoris'}">${isFav(p.id)?'♥':'♡'}</button>
            <button type="button" id="quickCartBtn" class="quick-icon quick-cart" ${available?'':'disabled'} title="${available?'Ajouter au panier':'Produit indisponible'}">🛒</button>
            <button type="button" id="questionBtn" class="quick-icon quick-question" title="Poser une question">✉</button>
            <button type="button" id="whatsappBtn" class="quick-icon quick-whatsapp" title="Partager sur WhatsApp">☏</button>
          </div>
          <div class="meta">${esc(p.categorie||'')}${p.sousCategorie?` · ${esc(p.sousCategorie)}`:''}${p.taille?` · Taille ${esc(p.taille)}`:''}${p.sku?` · Réf. ${esc(p.sku)}`:''}</div>
          <div class="desc">${esc(p.description||'Aucune description renseignée.')}</div>
          <div class="pricebox"><span class="sale">${euro(p.prixVente)}</span>${Number(p.prixRetail||0)>Number(p.prixVente||0)?`<span class="retail">${euro(p.prixRetail)}</span>`:''}${pc>0?`<span class="discount">-${pc}%</span>`:''}</div>
          <div class="stock ${available?'ok':'no'}">${available?'✓ Disponible':'Indisponible'}</div>
          <div class="actions"><button class="primary" ${available?'':'disabled'} id="addBtn">Ajouter au panier</button><a class="btn secondary" href="/">Continuer mes achats</a></div>
          <div class="note">Stock limité — article vendu dans la limite des quantités disponibles.</div>
        </div>
      </section>`;
    document.querySelectorAll('.thumbs img').forEach((img,i)=>img.addEventListener('click',()=>setMainPhoto(photos[i],i)));
    currentProduct=p;
    const add=document.getElementById('addBtn');if(add&&available)add.addEventListener('click',()=>addToCart(p));
    const quickCart=document.getElementById('quickCartBtn');if(quickCart&&available)quickCart.addEventListener('click',()=>addToCart(p));
    const favBtn=document.getElementById('favBtn');if(favBtn)favBtn.addEventListener('click',()=>toggleFav(p));
    const questionBtn=document.getElementById('questionBtn');if(questionBtn)questionBtn.addEventListener('click',openProductQuestion);
    const whatsappBtn=document.getElementById('whatsappBtn');if(whatsappBtn)whatsappBtn.addEventListener('click',shareProductWhatsApp);
  }catch(e){app.className='status';app.textContent='Impossible de charger ce produit : '+String(e.message||e)}
}
loadProduct();
</script>
</body>
</html>
